services:
  - type: web
    runtime: node
    name: dongtai-care-dispatch-platform
    repo: https://github.com/LBH78/dongtai-care-dispatch-platform
    branch: codex/production-backend
    region: singapore
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: dongtai-orders-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
